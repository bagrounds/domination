name: Bug report
description: Tell us about something that went wrong in Domination.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! In Domination, **Settings → Debug → Open GitHub bug form** opens this form with the diagnostics filled in.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you know how to make it happen again, list the steps.
      placeholder: |
        1. Start a private game with a friend
        2. ...
  - type: upload
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. A screenshot or screen recording can help show the problem.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        The bug report from **Settings → Debug** in Domination: the app version, your browser, the page address (including any room code), and recent app activity and errors from your device. This issue is public, so remove anything you'd rather not share.
      render: text
