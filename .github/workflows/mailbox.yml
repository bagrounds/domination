name: Deploy Mailbox

on:
  push:
    branches:
      - master
      - copilot/design-async-play-modification
    paths:
      - 'mailbox/**'
      - '.github/workflows/mailbox.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mailbox
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mailbox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mailbox/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Mailbox URL: $url"

      - name: Smoke test
        env:
          MAILBOX_URL: ${{ steps.deploy.outputs.url }}
        run: |
          room="smoke$GITHUB_RUN_ID"
          status=$(curl -s -o /dev/null -w '%{http_code}' "$MAILBOX_URL/v1/rooms/$room")
          echo "GET $room -> $status"
          test "$status" = 204
